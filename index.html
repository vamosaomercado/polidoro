<!DOCTYPE html>
<html lang="pt-BR" data-modo="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="author" content="Alan Correa">
<title>Polidoro - Limpeza de Piscinas</title>
<meta name="application-name" content="Polidoro">
<meta name="apple-mobile-web-app-title" content="Polidoro">
<meta name="description" content="Rotas do dia, dosagens, estoque, fotos de antes e depois e recibos para quem limpa piscinas.">
<meta property="og:title" content="Polidoro - Limpeza de Piscinas">
<meta property="og:description" content="Rotas do dia, dosagens, estoque, fotos e recibos no seu celular.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== tema único: azul (contraste ≥ 4,5:1 com texto branco) ===== */
html{--acRGB:36,98,188;--ac-forte:#1A4787}
html{--ac:rgb(var(--acRGB));--ac2:rgba(var(--acRGB),.10);--ac-borda:rgba(var(--acRGB),.22);--ac-ink:#fff}
html[data-modo=escuro]{--ac:color-mix(in srgb, rgb(var(--acRGB)) 70%, #ffffff);--ac2:rgba(var(--acRGB),.26);--ac-borda:transparent;--ac-forte:var(--ac);--ac-ink:#10171a}

/* ===== tokens da Lousa ===== */
html{
  --ff:'Nunito',system-ui,sans-serif;--fd:'Caveat',cursive;
  --r:18px;--r2:12px;--topo-h:54px;--nav-h:58px;
  /* modo claro: neutros com um leve toque da cor escolhida */
  --bg:color-mix(in srgb, rgb(var(--acRGB)) 5%, #F7F8F6);
  --surf:#FFFFFF;
  --surf2:color-mix(in srgb, rgb(var(--acRGB)) 7%, #F0F3F1);
  --campo:color-mix(in srgb, rgb(var(--acRGB)) 4%, #F7F9F8);
  --ink:#14202E;--ink2:#536273;
  --linha:color-mix(in srgb, rgb(var(--acRGB)) 12%, #E1E6E3);--linha-forte:color-mix(in srgb, rgb(var(--acRGB)) 24%, #C4CDC9);
  --perigo:#B3392B;--perigo2:#FCEDEA;--perigo-borda:#F2CAC2;--ok:#1C7A4F;
  --alerta:#8F5300;--alerta2:#FFF4DE;--alerta-borda:#F0D398;
  --borda:1px solid var(--linha);--borda-tracejada:1.5px dashed var(--linha-forte);
  --sombra:0 1px 2px rgba(16,28,44,.04),0 4px 14px rgba(16,28,44,.06);--sombra-alta:0 2px 4px rgba(16,28,44,.05),0 12px 28px rgba(16,28,44,.10);
  --btn-sombra:0 2px 10px rgba(var(--acRGB),.28);--hover:rgba(16,28,44,.05);
  --toast-bg:#14202E;--toast-ink:#F6F8FB;--nav-bg:rgba(255,255,255,.88);--brilho:.10;
}
html[data-modo=escuro]{
  --bg:#0F1720;--surf:#17222E;--surf2:#1E2B39;
  --ink:#E8EEF5;--ink2:#9AAABB;--linha:#263445;--linha-forte:#354659;
  --perigo:#E07B64;--perigo2:rgba(224,123,100,.16);--ok:#5FBF90;--alerta:#E7A54B;--alerta2:rgba(231,165,75,.15);
  --campo:#1E2B39;--perigo-borda:transparent;--alerta-borda:transparent;
  --sombra:0 2px 12px rgba(0,0,0,.3);--sombra-alta:0 10px 26px rgba(0,0,0,.45);--hover:rgba(255,255,255,.07);
  --btn-sombra:0 2px 10px rgba(var(--acRGB),.35);
  --toast-bg:#E8EEF5;--toast-ink:#17222E;--nav-bg:color-mix(in srgb,#0F1720 90%,transparent);--brilho:.16;
}

/* ===== base ===== */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(var(--acRGB),var(--brilho)),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
body.travado{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:700;line-height:1.1}
p{margin:0}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.i{width:18px;height:18px;flex:none}

/* ---- casca ---- */
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 4px 14px;background:var(--bg)}
.marca{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.marca-ico{width:34px;height:34px;flex:none}.marca-ico svg{width:34px;height:34px;display:block}
.marca-txt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.marca-txt b{font-family:var(--fd);font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca-txt small{font-size:.64rem;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.ico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:inherit;flex:none}
.ico svg{width:21px;height:21px}
@media (hover:hover){.ico:hover{background:var(--hover)}}
#btnTema svg{transition:transform .35s ease}#btnTema:active svg{transform:rotate(-30deg) scale(.9)}
.ico.caixa{border:var(--borda);background:var(--surf)}
.ico.mini{width:30px;height:30px;border-radius:10px}.ico.mini svg{width:16px;height:16px}
#btnBack{display:none}body.sub #btnBack{display:grid}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:6px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:var(--borda);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::before,.nav::after{content:'';margin:auto}
@media (max-width:560px){.nav{justify-content:space-between;gap:4px}.nav::before,.nav::after{display:none}.nav button{padding:9px 13px}.nav button:not(.on){padding:9px 0;width:44px;justify-content:center}.nav button:not(.on) span{display:none}.nav button svg{width:19px;height:19px}}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--surf);border:1px solid var(--linha);font-size:.8rem;font-weight:700;opacity:.7}
.nav button svg{width:17px;height:17px}
.nav button.on{opacity:1;background:var(--ac);color:var(--ac-ink);border-color:transparent;box-shadow:0 3px 12px rgba(var(--acRGB),.3)}
.vista{padding:10px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.vista.entra{animation:entra .2s ease}
@keyframes entra{from{transform:translateY(8px);opacity:.4}}

/* ---- textos ---- */
.eyebrow{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55;font-weight:700}
.saudacao{margin:8px 0 18px}.saudacao h1{font-size:2.6rem;line-height:1;margin:4px 0 6px}.saudacao .sub{font-size:.92rem;opacity:.75}
.cabeca{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 14px}.cabeca h1{font-size:2.1rem}
.secao{margin-top:24px}
.secao-topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}.secao-topo h2{font-size:1.5rem}
.link{color:var(--ac);font-size:.84rem;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.link .i{width:15px;height:15px}
.meta{font-size:.78rem;opacity:.62}
.dica{font-size:.78rem;opacity:.62;margin-top:6px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{font-weight:800}
.credito{margin-top:28px;text-align:center;font-size:.72rem;opacity:.45}

/* ---- botões ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--ac);color:var(--ac-ink);font-weight:700;font-size:.9rem;box-shadow:var(--btn-sombra);transition:transform .12s,filter .12s;text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surf);color:var(--ink);border:var(--borda);box-shadow:none}
.btn.suave{background:var(--ac2);color:var(--ac-forte);box-shadow:none}
.btn.perigo{background:var(--surf);color:var(--perigo);border:var(--borda);box-shadow:none}
.btn.mini{padding:7px 13px;font-size:.8rem;gap:6px}.btn.mini .i{width:15px;height:15px}
.btn.bloco{width:100%;display:flex;flex-direction:row;gap:8px;margin-bottom:0}
.btn:disabled{opacity:.5}
.btn+.btn.bloco,.btn.bloco+.btn{margin-top:8px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dupla .btn.bloco+.btn.bloco,.dupla .btn+.btn{margin-top:0}
.tripla{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{padding:7px 13px;border-radius:999px;background:var(--surf2);border:var(--borda);font-size:.8rem;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.rola{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips.rola::-webkit-scrollbar{display:none}
.selo{display:inline-flex;align-items:center;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surf2);font-weight:800;color:var(--ink2);white-space:nowrap}
.selo.ok{background:var(--ac2);color:var(--ac-forte)}.selo.alerta{background:var(--alerta2);color:var(--alerta);box-shadow:inset 0 0 0 1px var(--alerta-borda)}.selo.perigo{background:var(--perigo2);color:var(--perigo);box-shadow:inset 0 0 0 1px var(--perigo-borda)}
.selos{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

/* ---- KPI ---- */
.grade-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.grade-kpi.tres{grid-template-columns:repeat(3,1fr)}
.kpi{padding:12px 6px;border-radius:16px;background:var(--surf);border:var(--borda);text-align:center;box-shadow:var(--sombra)}
.kpi b{display:block;font-family:var(--fd);font-size:2.1rem;color:var(--ac);line-height:1;white-space:nowrap}
.kpi b.menor{font-size:1.55rem}
.kpi span{display:block;margin-top:4px;font-size:.66rem;opacity:.6;line-height:1.25}
.kpi.perigo b{color:var(--perigo)}.kpi.alerta b{color:var(--alerta)}

/* ---- semana ---- */
.mes-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mes-topo h2{font-size:1.4rem;text-align:center;flex:1}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.dia{padding:9px 2px 7px;border-radius:var(--r2);background:var(--surf);border:var(--borda);display:flex;flex-direction:column;align-items:center;gap:2px}
.dia .ds{font-size:.6rem;opacity:.55;text-transform:uppercase;font-weight:700}
.dia .dn{font-family:var(--fd);font-size:1.3rem;font-weight:700;line-height:1}
.dia .pontos{display:flex;gap:2px;height:5px}
.dia .pontos i{width:4px;height:4px;border-radius:50%;background:var(--ac)}
.dia.hoje{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.dia.sel{background:var(--ac);color:var(--ac-ink);border-color:transparent;box-shadow:0 3px 12px rgba(var(--acRGB),.3)}
.dia.sel .pontos i{background:var(--ac-ink)}

/* ---- cartões ---- */
.cartao{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--surf);border:var(--borda);box-shadow:var(--sombra);margin-bottom:9px;text-align:left;width:100%;cursor:pointer;transition:transform .12s,box-shadow .12s}
.cartao:hover{box-shadow:var(--sombra-alta)}
.cartao.lista{display:block;cursor:default}
.cartao-txt{flex:1;min-width:0;cursor:pointer}
.cartao h3{font-family:var(--ff);font-size:.98rem;font-weight:700;line-height:1.3}
.marcador{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--linha-forte);display:grid;place-items:center;font-family:var(--fd);font-size:1.2rem;font-weight:700;color:var(--ac)}
.marcador .i{width:16px;height:16px}
.cartao.feito .marcador{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.cartao.feito .cartao-txt{opacity:.6}
.cartao.inativo{opacity:.5}
.data-bloco{flex:none;width:46px;text-align:center;padding:5px 0;border-radius:var(--r2);background:var(--ac2);color:var(--ac-forte)}
.data-bloco b{display:block;font-family:var(--fd);font-size:1.45rem;line-height:1}
.data-bloco span{font-size:.58rem;text-transform:uppercase;opacity:.8;font-weight:800}
.ordem{display:flex;flex-direction:column;gap:3px}
.ordem button{width:28px;height:22px;border-radius:8px;display:grid;place-items:center;background:var(--surf2);color:var(--ink2)}
.ordem .i{width:14px;height:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.kv b{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;opacity:.55;padding-top:3px}
.linha-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:var(--borda);font-size:.9rem}
.linha-item:first-child{border-top:0}

.aviso{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r);background:var(--ac2);color:var(--ac-forte);border:1px solid var(--ac-borda);margin-bottom:10px;font-size:.86rem;line-height:1.4}
.aviso .i{margin-top:1px}
.aviso.alerta{background:var(--alerta2);color:var(--alerta);border-color:var(--alerta-borda)}
.aviso.perigo{background:var(--perigo2);color:var(--perigo);border-color:var(--perigo-borda)}
.vazio{padding:24px 18px;border-radius:var(--r);background:var(--surf2);border:var(--borda-tracejada);text-align:center;margin-bottom:10px}
.vazio h3{font-size:1.6rem;margin-bottom:4px}.vazio p{font-size:.86rem;opacity:.65}
.vazio .btn{margin-top:12px}
.passos{list-style:none;margin:0 0 16px;padding:0;counter-reset:passo}
.passos li{counter-increment:passo;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px 14px 52px;border-radius:var(--r);background:var(--surf);border:var(--borda);margin-bottom:9px;position:relative;box-shadow:var(--sombra)}
.passos li::before{content:counter(passo);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ac2);color:var(--ac-forte);font-family:var(--fd);font-weight:700;font-size:1.1rem}
.passos li.feito::before{content:'✓';background:var(--ac);color:var(--ac-ink)}
.passos li b{flex:1;font-size:.98rem}
.passos li span{width:100%;order:3;font-size:.78rem;opacity:.6}
.atalhos4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.atalhos4>*{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px 10px;border-radius:16px;background:var(--surf);border:var(--borda);box-shadow:var(--sombra);font-size:.74rem;font-weight:700}
.atalhos4 .i{width:22px;height:22px;color:var(--ac)}
.abas{display:flex;gap:6px;margin:18px 0 12px}
.abas button{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;padding:8px 10px;border-radius:999px;border:var(--borda);background:var(--surf);font-size:.82rem;font-weight:700;opacity:.7}
.abas button.on{opacity:1;background:var(--ac);color:var(--ac-ink);border-color:transparent}
.abas .i{width:16px;height:16px}
.nuvem-st{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;opacity:.9}.nuvem-st .i{width:16px;height:16px}
.nuvem-st.ok{color:var(--ok)}.nuvem-st.alerta{color:var(--alerta)}.nuvem-st.perigo{color:var(--perigo)}
.btn-google{gap:10px}.btn-google .i{width:20px;height:20px}
.divisor{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:.72rem;opacity:.6;text-transform:uppercase;letter-spacing:.09em;font-weight:800}.divisor::before,.divisor::after{content:'';flex:1;border-top:var(--borda)}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ac2);color:var(--ac-forte);font-weight:800;object-fit:cover}
.atualiza{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 16px;border-radius:999px;background:var(--toast-bg);color:var(--toast-ink);font-size:.86rem;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:520px;margin:0 auto}
.cartao.heroi{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.anel-box{position:relative;width:92px;height:92px;flex:none}.anel{width:92px;height:92px;display:block}.anel circle{transition:stroke-dashoffset .5s ease}
.anel-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.anel-txt b{font-family:var(--fd);font-size:2.3rem;color:var(--ac)}.anel-txt span{font-size:.66rem;opacity:.6;margin-top:2px}
.heroi h3{font-family:var(--fd);font-size:1.6rem;line-height:1.05;margin:2px 0}
@media (max-width:380px){.nav button:not(.on){width:40px}}
.prog{height:6px;border-radius:99px;background:var(--surf2);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .25s}
.prog.alerta i{background:var(--alerta)}.prog.perigo i{background:var(--perigo)}

/* ---- formulário ---- */
input,select,textarea{width:100%;min-width:0;padding:10px 13px;border-radius:var(--r2);border:var(--borda);background:var(--surf);font-size:.94rem}
.cartao input,.cartao select,.cartao textarea{background:var(--campo)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0;border-color:transparent}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);padding:0}
textarea{resize:vertical;min-height:72px;line-height:1.5}
.bloco{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.bloco:last-child{margin-bottom:0}
.rotulo{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;opacity:.6;font-weight:800}
.troca{display:flex;align-items:center;gap:10px;font-size:.9rem;margin-top:4px}
.busca{position:relative;margin-bottom:10px}.busca .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.busca input{padding-left:40px;border-radius:999px}
.med{border-radius:14px;padding:10px 11px;background:var(--campo);border:1.5px solid var(--linha)}
.med input{font-size:1.35rem;font-weight:800;padding:6px 10px;margin:4px 0 2px;background:var(--surf)!important}
.med .meta{font-size:.72rem}
.med.ok{border-color:color-mix(in srgb,var(--ac) 60%,transparent);background:var(--ac2)}
.med.baixo,.med.alto{border-color:color-mix(in srgb,var(--alerta) 55%,transparent);background:var(--alerta2)}
.dose{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px dashed var(--linha)}
.dose:first-child{border-top:0;padding-top:0}.dose:last-child{padding-bottom:0}
.dose .q{font-family:var(--fd);font-size:1.75rem;font-weight:700;color:var(--ac);white-space:nowrap;line-height:1}
.dose .nota{font-size:.76rem;color:var(--alerta);margin-top:4px;display:flex;gap:5px;align-items:flex-start}
.dose .nota .i{width:14px;height:14px;margin-top:2px}
.linha-prod{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:var(--r2);overflow:hidden;background:var(--surf2);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.thumb .x .i{width:14px;height:14px}
.thumb .tag{position:absolute;left:5px;bottom:5px;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:999px;color:#fff;background:rgba(0,0,0,.55);text-transform:uppercase;letter-spacing:.04em}
.addph{aspect-ratio:1;border:var(--borda-tracejada);border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ac);font-weight:700;font-size:.78rem;cursor:pointer;background:transparent}
.addph .i{width:22px;height:22px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.salvar-fixo{position:sticky;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:5;margin-top:18px}
.salvar-fixo .btn{box-shadow:0 6px 22px rgba(var(--acRGB),.45)}
.logo-box{width:72px;height:72px;border-radius:16px;background:var(--surf2);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-box img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo-box svg{width:44px;height:44px}

/* ---- folha (modal) ---- */
.folha{position:fixed;inset:0;z-index:60;background:rgba(10,16,13,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.folha.open{display:flex}
.folha-card{width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);animation:sobe .22s ease}
@keyframes sobe{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.folha-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 10px 8px 18px;border-bottom:var(--borda)}
.folha-topo h2{font-size:1.6rem}
.folha-corpo{flex:1;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media (min-width:700px){.folha{align-items:center}.folha-card{border-radius:22px;max-height:88vh}}
.visor img{width:100%;border-radius:var(--r2);display:block}
.mapa{position:relative;height:270px;border-radius:var(--r);overflow:hidden;border:var(--borda);box-shadow:var(--sombra);background:var(--surf2)}
.mapa iframe{width:100%;height:100%;border:0;display:block}
html[data-modo=escuro] .mapa iframe{filter:invert(.9) hue-rotate(180deg) saturate(.7) brightness(.95)}
.mapa .carregando{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;opacity:.5;z-index:-1}
.chip:disabled{opacity:.4}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;padding:11px 18px;border-radius:18px;background:var(--toast-bg);color:var(--toast-ink);font-size:.86rem;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- recibo (folha branca) ---- */
.recibo{background:#fff;color:#1B241F;border-radius:var(--r2);padding:20px 18px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-family:var(--ff)}
.recibo .rhd{display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--ac-forte);padding-bottom:10px;margin-bottom:14px}
html[data-modo=escuro] .recibo .rhd{border-color:rgb(var(--acRGB))}
.recibo .rhd img{width:56px;height:56px;object-fit:contain;border-radius:10px}
.recibo .rnome{font-family:var(--fd);font-size:1.9rem;line-height:1}
.recibo .rmt{font-size:.74rem;color:#5E6B62}
.recibo .rnum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:800}
.recibo .rval{background:rgba(var(--acRGB),.12);color:rgb(var(--acRGB));font-weight:800;padding:6px 12px;border-radius:999px;font-size:1.05rem;white-space:nowrap}
.recibo .rass{margin-top:30px;text-align:center}
.recibo .rass .assin{font-family:var(--fd);font-size:1.8rem;line-height:1}
.recibo .rass hr{border:0;border-top:1px solid #555;width:70%;margin:2px auto 4px}
#printArea{display:none}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}body.printing{background:#fff}#printArea .recibo{box-shadow:none}}
</style>

function cubagem(f,c,l,pr,pf){if(!c||!pr)return null;if(f!=='red'&&!l)return null;const p=(pr+(pf||pr))/2;
  if(f==='red')return Math.PI*(c/2)**2*p;if(f==='oval')return Math.PI/4*c*l*p;return c*l*p;}
function stMed(k,v){if(v==null||!FAIXA[k])return '';const [a,b]=FAIXA[k];return v<a?'baixo':v>b?'alto':'ok';}
function fmtQ(q,un){q=Number(q)||0;
  if(un==='g')return q>=1000?trimN(q/1000,2)+' kg':fmtN(Math.round(q))+' g';
  if(un==='ml')return q>=1000?trimN(q/1000,2)+' L':fmtN(Math.round(q))+' ml';
  return trimN(q,2)+' '+un;}
function calcDosagem(m3,med){const f=DB.cfg.fat;const out=[];const {ph,cloro:cl,alc,dur}=med;let alcRuim=false;
  if(alc!=null){
    if(alc<80){alcRuim=true;const dif=Math.max(0,f.alcAlvo-alc);
      out.push({tipo:'alc',un:'g',qtd:dif/10*m3*f.alc,titulo:'Elevador de alcalinidade (bicarbonato)',texto:`Alcalinidade ${trimN(alc,1)} → ${trimN(f.alcAlvo,1)} ppm · ${trimN(f.alc,1)} g por m³ a cada 10 ppm`,aviso:'Aplique primeiro. Ajuste o pH só depois de ~6 h com o filtro ligado.'});}
    else if(alc>120){alcRuim=true;out.push({titulo:'Alcalinidade alta',texto:`${trimN(alc,1)} ppm (ideal até 120)`,aviso:'Aplique redutor de pH aos poucos, com a bomba desligada, e meça de novo no dia seguinte.'});}}
  if(ph!=null){
    if(ph<7.2){const q=Math.max(0,f.phAlvo-ph)/0.1*m3*f.phMais;
      out.push({tipo:'phMais',un:'g',qtd:q,titulo:'Elevador de pH (barrilha)',texto:`pH ${trimN(ph,1)} → ${trimN(f.phAlvo,1)} · ${trimN(f.phMais,1)} g por m³ a cada 0,1`,aviso:alcRuim?'Corrija a alcalinidade antes: ela costuma puxar o pH junto. Meça de novo antes de aplicar.':''});}
    else if(ph>7.6){const q=Math.max(0,ph-f.phAlvo)/0.1*m3*f.phMenos;
      out.push({tipo:'phMenos',un:'ml',qtd:q,titulo:'Redutor de pH',texto:`pH ${trimN(ph,1)} → ${trimN(f.phAlvo,1)} · ${trimN(f.phMenos,1)} ml por m³ a cada 0,1`,aviso:alc!=null&&alc<80?'Corrija a alcalinidade antes de mexer no pH.':''});}}
  if(dur!=null){
    if(dur<200){const dif=Math.max(0,f.durAlvo-dur);const q=dif/10*m3*f.dur;const et=Math.max(1,Math.ceil(dif/(f.etapaDur||50)));
      out.push({tipo:'dur',un:'g',qtd:q,titulo:'Cloreto de cálcio (dureza)',texto:`Dureza ${trimN(dur,1)} → ${trimN(f.durAlvo,1)} ppm · ${trimN(f.dur,1)} g por m³ a cada 10 ppm`,aviso:et>1?`Aplique em ${et} etapas de ${fmtQ(q/et,'g')} para não turvar a água.`:''});}
    else if(dur>400)out.push({titulo:'Dureza cálcica alta',texto:`${trimN(dur,1)} ppm (ideal até 400)`,aviso:'Não há produto que baixe a dureza: o caminho é renovar parte da água.'});}
  if(cl!=null){
    if(cl<f.cloroAlvo){const q=(f.cloroAlvo-cl)*m3/(f.cloroConc/100);
      out.push({tipo:'cloro',un:'g',qtd:q,titulo:'Cloro',texto:`Cloro ${trimN(cl,1)} → ${trimN(f.cloroAlvo,1)} ppm · produto com ${trimN(f.cloroConc,1)}% de cloro ativo`});}
    else if(cl>3)out.push({titulo:'Cloro alto',texto:`${trimN(cl,1)} ppm (ideal até 3)`,aviso:'Não adicione cloro hoje. Libere o banho só abaixo de 3 ppm.'});}
  if([ph,cl,alc,dur].some(v=>v!=null)&&f.algicida>0)
    out.push({tipo:'algicida',un:'ml',qtd:m3*f.algicida,titulo:'Algicida de manutenção (opcional)',texto:`${trimN(f.algicida,1)} ml por m³ · uso semanal`});
  return out;}
function dosesHTML(m3,med,usar){
  if(!m3)return '<p class="meta">Informe o volume da piscina (m³) para calcular as dosagens.</p>';
  const ds=calcDosagem(m3,med);
  if(!ds.length)return '<p class="meta">Digite as medições e o app mostra quanto aplicar de cada produto.</p>';
  return ds.map(d=>`<div class="dose"><div style="flex:1;min-width:0"><div class="b" style="font-size:.9rem">${d.titulo}</div><div class="meta">${d.texto}</div>${d.aviso?`<div class="nota">${ic('alerta')}<span>${d.aviso}</span></div>`:''}</div>${d.qtd!=null?`<div style="text-align:right"><div class="q">${fmtQ(d.qtd,d.un)}</div>${usar&&d.tipo?`<button class="btn mini suave" style="margin-top:6px" onclick="usarDose('${d.tipo}',${Math.round(d.qtd)})">Usar</button>`:''}</div>`:''}</div>`).join('');}
function extenso(v){
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ct=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{if(!n)return '';if(n===100)return 'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(ct[c]);
    if(r){if(r<20)p.push(u[r]);else{const d=Math.floor(r/10),un=r%10;p.push(dz[d]+(un?' e '+u[un]:''));}}return p.join(' e ');};
  const inteiro=n=>{const mi=Math.floor(n/1e6),mil=Math.floor(n%1e6/1000),r=n%1000,p=[];
    if(mi)p.push(mi===1?'um milhão':ate999(mi)+' milhões');if(mil)p.push(mil===1?'mil':ate999(mil)+' mil');if(r)p.push(ate999(r));
    let s='';p.forEach((x,i)=>{if(!i)s=x;else s+=((i===p.length-1&&r&&(r<100||r%100===0))?' e ':' ')+x;});return s;};
  const tot=Math.round((Number(v)||0)*100),re=Math.floor(tot/100),ce=tot%100;let s='';
  if(re)s=inteiro(re)+(re===1?' real':(re%1e6===0?' de reais':' reais'));
  if(ce)s+=(s?' e ':'')+ate999(ce)+(ce===1?' centavo':' centavos');
  return s||'zero reais';}

function mudarDia(data,k){const d=parseD(data);d.setDate(d.getDate()+k);go('hoje',{data:isoDate(d)},true);}
function moverOrdem(id,dow,dir){DB.clientes.sort((a,b)=>(a.ordem||0)-(b.ordem||0)).forEach((c,k)=>c.ordem=k+1);
  const l=naRota(dow);const i=l.findIndex(c=>c.id===id),j=i+dir;

let MAPA_MODO='pendentes';
const navLink=c=>'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(enderecoCompleto(c));
function mapaEmbed(l){const ad=l.slice(0,10).map(c=>encodeURIComponent(enderecoCompleto(c)));

function abrirRota(data,modo){const dow=parseD(data).getDay();

function escolherClienteVisita(data){const l=DB.clientes.filter(c=>c.ativo!==false).sort(byNome);if(!l.length)return go('clienteForm');

let PAINEL_MODO=null;
const brl0=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:Number(n)%1?2:0});
function abrirDia(iso){closeSheet();STACK=[{name:'hoje',params:{data:iso}}];render(true);window.scrollTo(0,0);}
function rotaDoDia(iso){const l=naRota(parseD(iso).getDay());return {l,feitos:l.filter(c=>visitaDoDia(c.id,iso)),pend:l.filter(c=>!visitaDoDia(c.id,iso))};}
const regioesDe=l=>[...new Set(l.map(c=>c.rota||c.bairro).filter(Boolean))];
function ultimaVisita(cid,antesDe,comProdutos){return DB.visitas.filter(v=>v.clienteId===cid&&v.data.slice(0,10)<antesDe&&(!comProdutos||v.produtos?.length)).sort((a,b)=>b.data.localeCompare(a.data))[0];}
function previsaoProdutos(clientes,antesDe){const tot={};let sem=0;
  clientes.forEach(c=>{const v=ultimaVisita(c.id,antesDe,true);if(!v){sem++;return;}v.produtos.forEach(p=>{if(item(p.itemId))tot[p.itemId]=(tot[p.itemId]||0)+p.qtd;});});
  const ord={perigo:0,alerta:1,ok:2};
  const linhas=Object.entries(tot).map(([id,q])=>{const it=item(id);const f=FACT[it.un]||1;const tem=it.qtd*f;const st=q>tem?'perigo':(tem-q<(it.min||0)*f?'alerta':'ok');return {it,q,tem,st};}).sort((a,b)=>ord[a.st]-ord[b.st]);
  return {linhas,sem};}
function previsaoHTML(pr){
  if(!pr.linhas.length)return `<p class="meta">${pr.sem?'Ainda sem visitas anteriores para estimar. A previsão aparece depois da primeira visita de cada piscina.':'Nada previsto.'}</p>`;
  return pr.linhas.map(({it,q,tem,st})=>`<div class="linha-item"><div style="flex:1;min-width:0"><div class="ell">${esc(it.nome)}</div><div class="meta">no estoque: ${fmtQ(tem,SMALL[it.un])}</div></div><div style="text-align:right"><b>${fmtQ(q,SMALL[it.un])}</b>${st!=='ok'?`<div><span class="selo ${st}">${st==='perigo'?'não vai dar':'fica no limite'}</span></div>`:''}</div></div>`).join('')
    +`<p class="dica">Estimativa pela última aplicação em cada piscina${pr.sem?` · ${pr.sem} sem histórico ficaram fora da conta`:''}.</p>`;}
function pontosAtencao(c,antesDe){const out=[];const v=ultimaVisita(c.id,antesDe);
  if(v){[['ph','pH',0],['cloro','Cloro',0],['alc','Alcalinidade',1],['dur','Dureza',1]].forEach(([k,l,fem])=>{const st=stMed(k,v[k]);if(st&&st!=='ok')out.push({t:`${l} ${fem?st.replace(/o$/,'a'):st} (${trimN(v[k],1)})`,c:'alerta'});});
    if(v.obs)out.push({t:v.obs,c:''});}
  else out.push({t:'primeira visita',c:''});
  const at=atrasos().filter(a=>a.c.id===c.id);if(at.length)out.push({t:`cobrar ${at.map(a=>MESC[+a.ym.slice(5)-1]).join(', ')}`,c:'perigo'});
  return {v,out};}
function anel(f,t){const r=34,C=2*Math.PI*r,p=t?f/t:0;
  return `<svg viewBox="0 0 80 80" class="anel" aria-hidden="true"><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--surf2)" stroke-width="8"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" transform="rotate(-90 40 40)"/></svg><div class="anel-txt"><b>${f}</b><span>de ${t}</span></div>`;}

VIEWS.inicio=()=>{document.title='Polidoro - Limpeza de Piscinas';const agora=new Date();const hoje=isoDate(agora);const hr=agora.getHours();const nome=primeiro(DB.cfg.responsavel);

    <ol class="passos">${nuvemConfigurada()?`<li class="${Nuvem.user?'feito':''}"><b>Sua conta</b>${Nuvem.user?'':`<button class="btn mini" onclick="go('config')">Entrar</button>`}<span>${Nuvem.user?esc(Nuvem.user.email||'Conectado'):'Backup na nuvem e uso em mais de um aparelho.'}</span></li>`:''}<li class="${DB.cfg.responsavel?'feito':''}"><b>Seu negócio e logo</b><button class="btn mini" onclick="go('config')">Abrir</button><span>Nome, CNPJ do MEI e chave Pix para recibos e cobranças.</span></li>
    <li><b>Primeiro cliente</b><button class="btn mini" onclick="go('clienteForm')">Cadastrar</button><span>Com os dias de visita e o volume da piscina.</span></li>

  const modo=PAINEL_MODO||(hr<14?'comeco':'fim');

  if(nuvemConfigurada()&&!Nuvem.user)h+=`<button class="aviso alerta" onclick="go('config')">${ic('nuvemx')}<p><b>Seus dados estão só neste celular.</b> Entre com a sua conta para ter backup na nuvem e usar em outro aparelho.</p></button>`;
  h+=`<div class="abas" style="margin-top:0"><button class="${modo==='comeco'?'on':''}" onclick="PAINEL_MODO='comeco';render()">${ic('nascer')}Começo do dia</button><button class="${modo==='fim'?'on':''}" onclick="PAINEL_MODO='fim';render()">${ic('lua')}Fim do dia</button></div>`;

  if(!l.length)h+=`<div class="rotulo">Hoje</div><h3>Dia sem rota</h3><p class="meta">Bom dia para repor o estoque e colocar as cobranças em dia.</p>`;
  else if(prox)h+=`<div class="rotulo">${feitos.length?'Próxima parada':'Primeira parada'}</div><h3 class="ell">${esc(prox.nome)}</h3><p class="meta ell">${esc(prox.bairro||prox.endereco||'')}${prox.m3?' · '+trimN(prox.m3,1)+' m³':''}</p><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn mini" onclick="novaVisita('${prox.id}')">Iniciar</button>${prox.endereco||prox.bairro?`<a class="btn mini ghost" href="${navLink(prox)}" target="_blank">${ic('navegar')}Ir até lá</a>`:''}</div>`;

function painelComeco(hoje,l,pend,m3){let h='';

function painelFim(hoje,l,pend){let h='';const vs=DB.visitas.filter(v=>v.data.slice(0,10)===hoje).sort((a,b)=>a.data.localeCompare(b.data));

  const am=new Date();am.setDate(am.getDate()+1);const amISO=isoDate(am);const r2=rotaDoDia(amISO);const m3b=r2.l.reduce((s,c)=>s+(c.m3||0),0);

  else h+=vazio('Amanhã está livre','Nenhuma piscina marcada para amanhã.');
  h+=`</div>`;
  return h;}

function painelMes(){const ym=ymNow();const vis=DB.visitas.filter(v=>v.data.startsWith(ym)).length;
  const rec=DB.pagamentos.filter(p=>p.data.startsWith(ym)).reduce((s,p)=>s+p.valor,0);const atv=atrasos().reduce((s,a)=>s+a.valor,0);

async function galeria(cid,filtro,mes){const tk=RT;const box=$('#abaC');let fotos=await idbAll('cliente',cid);if(tk!==RT||!box.isConnected)return;
  fotos.sort((a,b)=>b.data.localeCompare(a.data));const meses=[...new Set(fotos.map(f=>f.data.slice(0,7)))];if(mes)fotos=fotos.filter(f=>f.data.startsWith(mes));
  let h=`<div class="chips rola">${[['todas','Todas'],['antes','Antes'],['depois','Depois'],['pares','Antes × Depois']].map(([k,l])=>`<button class="chip ${filtro===k?'on':''}" onclick="galeria('${cid}','${k}','${mes}')">${l}</button>`).join('')}</div>`;
  if(meses.length>1)h+=`<select style="margin-bottom:12px" onchange="galeria('${cid}','${filtro}',this.value)"><option value="">Todos os meses</option>${meses.map(m=>`<option value="${m}" ${m===mes?'selected':''}>${cap(mesNome(m))}</option>`).join('')}</select>`;
  if(filtro==='pares'){const porV={};fotos.forEach(f=>{const k=f.visitaId||f.id;const o=porV[k]||(porV[k]={data:f.data});if(!o[f.tipo])o[f.tipo]=f;});
    const pares=Object.values(porV).filter(p=>p.antes&&p.depois).sort((a,b)=>b.data.localeCompare(a.data));
    h+=pares.length?pares.map(p=>`<div class="cartao lista"><div class="eyebrow" style="margin-bottom:8px">${fmtData(p.data)}</div><div class="par">${['antes','depois'].map(t=>`<div class="thumb" onclick="verFoto('${p[t].id}')"><img src="${objURL(p[t].blob)}" alt=""><span class="tag">${t}</span></div>`).join('')}</div></div>`).join(''):vazio('Sem pares','Nenhuma visita com foto de antes e de depois.');}
  else{const l=filtro==='todas'?fotos:fotos.filter(f=>f.tipo===filtro);
    h+=l.length?`<div class="thumbs">${l.map(f=>`<div class="thumb" onclick="verFoto('${f.id}')"><img src="${objURL(f.blob)}" alt=""><span class="tag">${f.tipo} ${fmtData(f.data).slice(0,5)}</span></div>`).join('')}</div>`:vazio('Sem fotos','As fotos tiradas nas visitas aparecem aqui.');}
  box.innerHTML=h;}

function removerFotoForm(i){const f=VF.fotos[i];if(f.existente)VF.remover.push(f.id);VF.fotos.splice(i,1);renderFotosForm();}
function movimentar(prods,sinal,motivo,ref){(prods||[]).forEach(p=>{const it=item(p.itemId);if(!it)return;const q=p.qtd/(FACT[it.un]||1)*sinal;
  it.qtd=+(it.qtd+q).toFixed(4);DB.movs.unshift({id:uid(),itemId:it.id,data:agoraISO(),qtd:+q.toFixed(4),motivo,ref});});if(DB.movs.length>500)DB.movs.length=500;}
async function salvarVisita(){const btn=$('#btnSalvarV');btn.disabled=true;
  try{const c=cli(VF.clienteId);if(VF.m3&&c&&VF.m3!==c.m3)c.m3=VF.m3;
    const produtos=VF.produtos.filter(p=>p.qtd>0&&item(p.itemId)).map(p=>{const it=item(p.itemId);return {itemId:it.id,nome:it.nome,qtd:p.qtd,un:SMALL[it.un]};});
    let v;if(VF.id){v=DB.visitas.find(x=>x.id===VF.id);movimentar(v.produtos,1,'Estorno (visita editada)',v.id);}else{v={id:uid(),clienteId:VF.clienteId};DB.visitas.push(v);}
    Object.assign(v,{data:VF.data||agoraISO(),ph:VF.ph,cloro:VF.cloro,alc:VF.alc,dur:VF.dur,produtos,obs:(VF.obs||'').trim()});
    movimentar(produtos,-1,'Visita: '+(c?.nome||''),v.id);
    for(const id of VF.remover)await idbDel(id);
    for(const f of VF.fotos)if(!f.existente)await idbPut({id:f.id,clienteId:v.clienteId,visitaId:v.id,tipo:f.tipo,data:f.data,blob:f.blob});
    v.nFotos=VF.fotos.length;save();
    const baixos=produtos.map(p=>item(p.itemId)).filter(i=>i&&i.min>0&&i.qtd<i.min);VF=null;go('visitaVer',{id:v.id,novo:1},true);
    if(baixos.length)toast(`Atenção: seu estoque de ${baixos[0].nome} está abaixo de ${trimN(baixos[0].min)} ${baixos[0].un}. Hora de repor.`,5000);else toast('Visita salva');
  }catch(e){console.error(e);toast('Erro ao salvar: '+e.message);btn.disabled=false;}}

VIEWS.visitaVer=async p=>{const v=DB.visitas.find(x=>x.id===p.id);if(!v){back();return;}const c=cli(v.clienteId);document.title='Visita · '+fmtData(v.data);
  let h=cab(esc(c?.nome||'Cliente removido'),c?.m3?`<span class="selo">${trimN(c.m3,1)} m³</span>`:'',`${DIASL[parseD(v.data).getDay()]}, ${fmtData(v.data)} às ${fmtHora(v.data)}`);
  if(p.novo)h+=`<div class="aviso">${ic('check')}<p><b>Visita salva!</b> Agora é só mandar o resumo para o cliente.</p></div>`;
  h+=`<div class="cartao lista"><div class="rotulo" style="margin-bottom:6px">Medições</div><div class="selos" style="margin:0">${selosMed(v)}</div>
  ${v.produtos.length?`<div class="rotulo" style="margin:14px 0 2px">Produtos aplicados</div>${v.produtos.map(x=>`<div class="linha-item"><span>${esc(x.nome)}</span><b>${fmtQ(x.qtd,x.un)}</b></div>`).join('')}`:''}
  ${v.obs?`<div class="rotulo" style="margin:14px 0 2px">Observações</div><p style="font-size:.9rem">${esc(v.obs)}</p>`:''}</div>
  <div class="secao">${secTopo('Enviar ao cliente',v.enviado?`<span class="selo ok">enviado ${fmtHora(v.enviado)}</span>`:'')}<button class="btn bloco" onclick="enviarTexto('${v.id}')">${ic('conversa')}Resumo no WhatsApp</button><button class="btn ghost bloco" onclick="verCard('${v.id}')">${ic('imagem')}Card com fotos e medições</button><p class="dica">O card junta medições, produtos e as fotos de antes e depois numa imagem só, com a sua marca.</p></div>
  <div class="secao">${secTopo('Fotos')}<div id="vFotos"><p class="meta">Carregando…</p></div></div>
  <div class="dupla" style="margin-top:20px"><button class="btn ghost" onclick="editarVisita('${v.id}')">${ic('lapis')}Editar</button><button class="btn perigo" onclick="excluirVisita('${v.id}')">${ic('lixo')}Excluir</button></div>`;
  V(h);const tk=RT;const fotos=await idbAll('visita',v.id);if(tk!==RT)return;const box=$('#vFotos');
  if(!fotos.length){box.innerHTML=vazio('Sem fotos','Nenhuma foto nesta visita.');return;}fotos.sort((a,b)=>a.data.localeCompare(b.data));
  const blk=t=>{const l=fotos.filter(f=>f.tipo===t);return l.length?`<div class="rotulo" style="margin:2px 0 8px">${t}</div><div class="thumbs" style="margin-bottom:12px">${l.map(f=>`<div class="thumb" onclick="verFoto('${f.id}')"><img src="${objURL(f.blob)}" alt=""></div>`).join('')}</div>`:'';};
  box.innerHTML=`<div class="cartao lista">${blk('antes')}${blk('depois')}<button class="link" onclick="compartilharFotos('${v.id}')">${ic('enviar')}Enviar as fotos originais</button></div>`;};

function textoVisita(v){const c=cli(v.clienteId);const hoje=v.data.slice(0,10)===isoDate(new Date());const m=[];
  if(v.ph!=null)m.push('pH '+trimN(v.ph,1));if(v.cloro!=null)m.push('Cloro '+trimN(v.cloro,1)+' ppm');if(v.alc!=null)m.push('Alcalinidade '+trimN(v.alc,1)+' ppm');if(v.dur!=null)m.push('Dureza '+trimN(v.dur,1)+' ppm');
  let t=`Olá ${primeiro(c?.nome)}! Sua piscina foi tratada ${hoje?'hoje':'em '+fmtData(v.data)} (${fmtHora(v.data)}h).\n`;
  if(m.length)t+=`\n💧 Medições: ${m.join(' | ')}`;
  if(v.produtos.length)t+=`\n🧪 Produtos: ${v.produtos.map(p=>fmtQ(p.qtd,p.un)+' '+p.nome).join(' + ')}`;
  if(v.obs)t+=`\n📝 ${v.obs}`;if(v.nFotos)t+=`\n📸 Fotos do antes e depois em anexo.`;
  t+=`\n\n${DB.cfg.nome}${DB.cfg.tel?' · '+DB.cfg.tel:''}`;return t;}
function marcarEnviado(id){const v=DB.visitas.find(x=>x.id===id);if(v&&!v.enviado){v.enviado=agoraISO();save();}}
function enviarTexto(id){marcarEnviado(id);const v=DB.visitas.find(x=>x.id===id);const c=cli(v.clienteId);if(!soDig(c?.tel))toast('Cliente sem telefone: escolha o contato no WhatsApp');window.open(waLink(c?.tel,textoVisita(v)),'_blank');}
async function excluirVisita(id){if(!confirm('Excluir esta visita? Os produtos voltam para o estoque e as fotos são apagadas.'))return;
  const v=DB.visitas.find(x=>x.id===id);movimentar(v.produtos,1,'Estorno (visita excluída)',v.id);DB.visitas=DB.visitas.filter(x=>x.id!==id);save();
  try{await idbDelWhere('visita',id);}catch(e){}toast('Visita excluída');back();}

/* ============ compartilhamento / imagens ============ */
let SHARE=null;
function baixarBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
async function compartilharBlob(blob,nome,texto){const file=new File([blob],nome,{type:blob.type||'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share(texto?{files:[file],text:texto}:{files:[file]});}catch(e){if(e.name==='NotAllowedError'){baixarBlob(blob,nome);toast('Imagem baixada — anexe no WhatsApp');}else if(e.name!=='AbortError')toast('Não foi possível compartilhar');}}
  else{baixarBlob(blob,nome);toast('Imagem baixada — anexe no WhatsApp');}}
async function compartilharFotos(vid){const fotos=await idbAll('visita',vid);if(!fotos.length)return;
  const files=fotos.map((f,i)=>new File([f.blob],`${f.tipo}-${i+1}.jpg`,{type:'image/jpeg'}));
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files});}catch(e){if(e.name!=='AbortError')toast('Não foi possível compartilhar');}}
  else{fotos.forEach((f,i)=>baixarBlob(f.blob,`${f.tipo}-${i+1}.jpg`));toast('Fotos baixadas');}}
function rr(x,X,Y,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function cover(x,img,X,Y,w,h){const iw=img.naturalWidth,ih=img.naturalHeight;const s=Math.max(w/iw,h/ih);const sw=w/s,sh=h/s;x.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,X,Y,w,h);}
function wrap(x,t,X,Y,maxW,lh){const ws=String(t).split(/\s+/);let line='';for(const w of ws){const tt=line?line+' '+w:w;if(x.measureText(tt).width>maxW&&line){x.fillText(line,X,Y);Y+=lh;line=w;}else line=tt;}if(line){x.fillText(line,X,Y);Y+=lh;}return Y;}
function cropCanvas(cv,h){const o=document.createElement('canvas');o.width=cv.width;o.height=Math.ceil(h);o.getContext('2d').drawImage(cv,0,0);return o;}
function espaco(x,px){try{x.letterSpacing=px+'px';}catch(e){}}
function drawMarca(x,X,Y,S,ac,ink){x.save();x.translate(X,Y);x.scale(S/24,S/24);x.lineCap='round';x.lineWidth=2.4;x.strokeStyle=ac;rr(x,2.7,2.7,18.6,18.6,5.2);x.stroke();
  x.lineWidth=2;x.strokeStyle=ink;x.stroke(new Path2D('M6.8 10.2c1.2-1 2.4-1 3.6 0s2.4 1 3.6 0 2.4-1 3.6 0'));x.strokeStyle=ac;x.stroke(new Path2D('M6.8 14.4c1.2-1 2.4-1 3.6 0s2.4 1 3.6 0 2.4-1 3.6 0'));x.restore();}
async function drawLogo(x,X,Y,S){const lg=await carregarImg(DB.cfg.logo);x.fillStyle='#fff';rr(x,X,Y,S,S,S*.22);x.fill();const s=Math.min((S-16)/lg.naturalWidth,(S-16)/lg.naturalHeight);
  x.drawImage(lg,X+(S-lg.naturalWidth*s)/2,Y+(S-lg.naturalHeight*s)/2,lg.naturalWidth*s,lg.naturalHeight*s);}

async function gerarCardVisita(v){await fontesProntas();const c=cli(v.clienteId)||{nome:'Cliente'};const cfg=DB.cfg;const W=1080,P=60;
  const BG='#0F1720',SF='#17222E',SF2='#1E2B39',INK='#E8EEF5',INK2='#9AAABB',AC=acClaro(),AL='#E7A54B';
  const cv=document.createElement('canvas');cv.width=W;cv.height=3600;const x=cv.getContext('2d');
  x.fillStyle=BG;x.fillRect(0,0,W,3600);
  const g=x.createRadialGradient(W/2,-260,40,W/2,-260,1000);g.addColorStop(0,`rgba(${acRGBs()},.42)`);g.addColorStop(1,'rgba(15,23,32,0)');x.fillStyle=g;x.fillRect(0,0,W,1000);
  let tx=P+150;if(cfg.logo){try{await drawLogo(x,P,58,122);}catch(e){drawMarca(x,P,58,122,AC,INK);}}else drawMarca(x,P,58,122,AC,INK);
  x.fillStyle=INK;x.font=`700 78px ${FD}`;x.fillText(cfg.nome||'Polidoro',tx,132,W-tx-P);
  x.fillStyle=INK2;x.font=`800 24px ${FONT}`;espaco(x,4);x.fillText('RELATÓRIO DE TRATAMENTO',tx,174,W-tx-P);espaco(x,0);
  let y=292;x.fillStyle=INK2;x.font=`800 25px ${FONT}`;espaco(x,3);x.fillText(`${DIASL[parseD(v.data).getDay()]}, ${fmtData(v.data)} · ${fmtHora(v.data)}`.toUpperCase(),P,y);espaco(x,0);
  y+=86;x.fillStyle=INK;x.font=`700 88px ${FD}`;x.fillText(c.nome,P,y,W-2*P);y+=46;
  const meds=[['pH',v.ph,'ph',''],['Cloro',v.cloro,'cloro','ppm'],['Alcalinidade',v.alc,'alc','ppm'],['Dureza',v.dur,'dur','ppm']].filter(m=>m[1]!=null);
  if(meds.length){const gap=18,tw=(W-2*P-gap*(meds.length-1))/meds.length,th=210;
    meds.forEach(([l,val,k,u],i)=>{const X=P+i*(tw+gap);const st=stMed(k,val);const cor=st==='ok'?AC:AL;
      x.fillStyle=SF;rr(x,X,y,tw,th,26);x.fill();x.strokeStyle=st==='ok'?`rgba(${acRGBs()},.55)`:'rgba(231,165,75,.55)';x.lineWidth=2;rr(x,X+1,y+1,tw-2,th-2,25);x.stroke();
      x.textAlign='center';x.fillStyle=INK2;x.font=`800 21px ${FONT}`;espaco(x,2);x.fillText(l.toUpperCase(),X+tw/2,y+52,tw-16);espaco(x,0);
      x.fillStyle=cor;x.font=`700 96px ${FD}`;x.fillText(trimN(val,1),X+tw/2,y+138,tw-16);
      x.font=`700 22px ${FONT}`;x.fillText((u?u+' · ':'')+(st==='ok'?'ideal':st==='baixo'?'baixo':'alto'),X+tw/2,y+180,tw-16);x.textAlign='left';});
    y+=th+70;}
  if(v.produtos.length){x.fillStyle=INK;x.font=`700 58px ${FD}`;x.fillText('Produtos aplicados',P,y);y+=24;
    const ch=24+v.produtos.length*66;x.fillStyle=SF;rr(x,P,y,W-2*P,ch,24);x.fill();let ly=y+60;
    v.produtos.forEach((p,i)=>{if(i){x.fillStyle=SF2;x.fillRect(P+26,ly-48,W-2*P-52,2);}x.fillStyle=INK;x.font=`600 30px ${FONT}`;x.fillText(p.nome,P+30,ly,W-2*P-320);
      x.textAlign='right';x.fillStyle=AC;x.font=`700 52px ${FD}`;x.fillText(fmtQ(p.qtd,p.un),W-P-30,ly+4);x.textAlign='left';ly+=66;});y+=ch+56;}
  if(v.obs){x.fillStyle=INK2;x.font=`600 29px ${FONT}`;y=wrap(x,'Obs.: '+v.obs,P,y,W-2*P,42)+24;}
  const fotos=await idbAll('visita',v.id);fotos.sort((a,b)=>a.data.localeCompare(b.data));
  const sel=[fotos.find(f=>f.tipo==='antes'),fotos.filter(f=>f.tipo==='depois').pop()].filter(Boolean);
  if(sel.length){const gap=20,w=sel.length===2?(W-2*P-gap)/2:W-2*P,h=sel.length===2?w*1.25:w*.72;
    for(let i=0;i<sel.length;i++){const f=sel[i];const u=URL.createObjectURL(f.blob);const im=await carregarImg(u);URL.revokeObjectURL(u);const X=P+i*(w+gap);
      x.save();rr(x,X,y,w,h,28);x.clip();cover(x,im,X,y,w,h);x.restore();
      const lab=f.tipo==='antes'?'ANTES':'DEPOIS';x.font=`800 26px ${FONT}`;espaco(x,3);const lw=x.measureText(lab).width+44;
      x.fillStyle=f.tipo==='antes'?AL:AC;rr(x,X+18,y+18,lw,52,26);x.fill();x.fillStyle='#12101a';x.fillText(lab,X+40,y+54);espaco(x,0);}
    y+=h+46;}
  x.fillStyle=SF2;x.fillRect(P,y,W-2*P,2);y+=56;x.textAlign='center';x.fillStyle=INK2;x.font=`600 27px ${FONT}`;
  const rod=[cfg.responsavel,cfg.tel,cfg.cnpj?'CNPJ '+cfg.cnpj:''].filter(Boolean).join('  ·  ');x.fillText(rod||cfg.nome,W/2,y,W-2*P);x.textAlign='left';y+=54;
  return toBlob(cropCanvas(cv,y),'image/jpeg',.9);}
async function verCard(id){const v=DB.visitas.find(x=>x.id===id);toast('Montando o card…',1500);
  try{const b=await gerarCardVisita(v);SHARE={blob:b,nome:`tratamento-${slug(cli(v.clienteId)?.nome)}-${v.data.slice(0,10)}.jpg`,texto:textoVisita(v)};
    openSheet('Card do tratamento',`<div class="visor"><img src="${objURL(b)}" alt="Card do tratamento"></div><div class="dupla" style="margin-top:12px"><button class="btn" onclick="marcarEnviado('${id}');compartilharBlob(SHARE.blob,SHARE.nome,SHARE.texto)">${ic('enviar')}Compartilhar</button><button class="btn ghost" onclick="marcarEnviado('${id}');baixarBlob(SHARE.blob,SHARE.nome)">${ic('baixar')}Baixar</button></div><p class="dica">No celular, “Compartilhar” abre a lista de apps: escolha o WhatsApp e o contato do cliente. O resumo em texto vai junto como legenda.</p>`);
  }catch(e){console.error(e);toast('Erro ao gerar o card');}}

let CALC=null;
VIEWS.calc=()=>{document.title='Calculadora';CALC=CALC||{m3:null,ph:null,cloro:null,alc:null,dur:null};const f=DB.cfg.fat;
  V(cab('Calculadora','','cubagem e dosagem')+
  `<div class="cartao lista">
  <label class="bloco"><span class="rotulo">Usar o volume de um cliente</span><select onchange="calcCli(this.value)"><option value="">— medidas avulsas —</option>${DB.clientes.filter(c=>c.m3).sort(byNome).map(c=>`<option value="${c.id}">${esc(c.nome)} (${trimN(c.m3,1)} m³)</option>`).join('')}</select></label>
  <label class="bloco"><span class="rotulo">Formato</span><select id="kFor" onchange="calcCub()"><option value="ret">Retangular</option><option value="red">Redonda</option><option value="oval">Oval</option></select></label>
  <div class="dupla"><label class="bloco"><span class="rotulo" id="klC">Comprimento (m)</span><input id="kC" inputmode="decimal" oninput="calcCub()"></label><label class="bloco" id="kwL"><span class="rotulo">Largura (m)</span><input id="kL" inputmode="decimal" oninput="calcCub()"></label><label class="bloco"><span class="rotulo">Prof. rasa (m)</span><input id="kPr" inputmode="decimal" oninput="calcCub()"></label><label class="bloco"><span class="rotulo">Prof. funda (m)</span><input id="kPf" inputmode="decimal" oninput="calcCub()" placeholder="igual à rasa"></label></div>
  <label class="bloco"><span class="rotulo">Volume (m³)</span><input id="kM3" inputmode="decimal" value="${numIn(CALC.m3)}" oninput="CALC.m3=num(this.value);kRes();calcDoses()"></label></div>
  <div class="grade-kpi tres" id="kRes"></div>
  <div class="secao" style="margin-top:6px">${secTopo('Medições')}<div class="cartao lista">${MEDS_HTML('CALC')}</div></div>
  <div class="secao">${secTopo('Quanto aplicar')}<div class="cartao lista" id="kDoses"></div></div>
  <div class="secao">${secTopo('Referências',`<button class="link" onclick="go('config')">${ic('ajustes')}Ajustar</button>`)}<div class="cartao lista" style="font-size:.86rem">
  <div class="linha-item"><span>Alcalinidade <span class="meta">· ideal 80–120</span></span><b>${trimN(f.alc,1)} g/m³ · 10 ppm</b></div>
  <div class="linha-item"><span>Dureza <span class="meta">· ideal 200–400</span></span><b>${trimN(f.dur,1)} g/m³ · 10 ppm</b></div>
  <div class="linha-item"><span>Cloro <span class="meta">· ideal 1–3</span></span><b>${trimN(f.cloroConc,1)}% ativo</b></div>
  <div class="linha-item"><span>pH <span class="meta">· ideal 7,2–7,6</span></span><b>${trimN(f.phMais,1)} g · ${trimN(f.phMenos,1)} ml/m³ · 0,1</b></div>
  <p class="dica">Ordem: alcalinidade → espera ~6 h → pH → cloro.</p></div></div>`);
  kRes();calcDoses();};
function calcCub(){const f=$('#kFor').value;$('#klC').textContent=f==='red'?'Diâmetro (m)':'Comprimento (m)';$('#kwL').style.display=f==='red'?'none':'';
  const m3=cubagem(f,num($('#kC').value),num($('#kL').value),num($('#kPr').value),num($('#kPf').value));if(m3){CALC.m3=+m3.toFixed(2);$('#kM3').value=numIn(CALC.m3);}kRes();calcDoses();}
function calcCli(id){const c=cli(id);if(!c)return;CALC.m3=c.m3;$('#kM3').value=numIn(c.m3);kRes();calcDoses();}
function kRes(){const m=CALC.m3;$('#kRes').innerHTML=m?`<div class="kpi"><b class="menor">${trimN(m,2)}</b><span>m³</span></div><div class="kpi"><b class="menor">${fmtN(m*1000)}</b><span>litros</span></div><div class="kpi"><b class="menor">${fmtN(m*1000/3.6/1000,1)}</b><span>mil galões</span></div>`:'';$('#kRes').style.display=m?'':'none';}
function calcDoses(){$('#kDoses').innerHTML=dosesHTML(CALC.m3,CALC,false);}

VIEWS.estoque=()=>{document.title='Estoque';const rank=i=>i.qtd<=0?0:(i.min>0&&i.qtd<i.min?1:2);const l=DB.estoque.slice().sort((a,b)=>rank(a)-rank(b));
  const baixos=DB.estoque.filter(i=>i.min>0&&i.qtd<i.min).length;
  let h=cab('Estoque',`<button class="btn mini" onclick="itemForm()">${ic('mais')}Produto</button>`,'carro e garagem');
  h+=`<div class="grade-kpi tres"><div class="kpi"><b>${DB.estoque.length}</b><span>produtos</span></div><div class="kpi ${baixos?'alerta':''}"><b>${baixos}</b><span>para repor</span></div><div class="kpi"><b>${DB.movs.filter(m=>m.data.slice(0,7)===ymNow()&&m.qtd<0).length}</b><span>saídas no mês</span></div></div>`;
  h+=`<p class="dica" style="margin:-4px 4px 12px">Os produtos lançados nas visitas são abatidos daqui automaticamente.</p>`;
  h+=l.map(i=>{const st=i.qtd<=0?'perigo':(i.min>0&&i.qtd<i.min?'alerta':'ok');const pct=i.min>0?Math.min(100,i.qtd/(i.min*3)*100):100;

function salvarPag(cid){const c=cid?cli(cid):null;const ref=$('#pRef')?$('#pRef').value:'';const valor=num($('#pVal').value);if(!valor)return toast('Informe o valor');

async function gerarReciboImg(p){await fontesProntas();const cfg=DB.cfg;const W=1080,P=70;const AC=acForte(),INK='#1B241F',INK2='#5E6B62';
  const cv=document.createElement('canvas');cv.width=W;cv.height=2200;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,2200);x.fillStyle=AC;x.fillRect(0,0,W,16);
  let y=66,tx=P+160;if(cfg.logo){try{await drawLogo(x,P,y,128);}catch(e){drawMarca(x,P,y,128,AC,INK);}}else drawMarca(x,P,y,128,AC,INK);
  x.fillStyle=INK;x.font=`700 74px ${FD}`;x.fillText(cfg.nome||'',tx,y+66,W-tx-P);x.fillStyle=INK2;x.font=`600 27px ${FONT}`;
  const info=[cfg.responsavel,cfg.cnpj?'CNPJ '+cfg.cnpj:'',cfg.tel].filter(Boolean).join(' · ');if(info)y=wrap(x,info,tx,y+110,W-tx-P,36)-110;
  y+=176;x.fillStyle=AC;x.fillRect(P,y,W-2*P,5);y+=90;
  x.fillStyle=INK;x.font=`800 38px ${FONT}`;espaco(x,1);x.fillText('RECIBO Nº '+numRecibo(p),P,y);espaco(x,0);
  const vt=brl(p.valor);x.font=`800 42px ${FONT}`;const vw=x.measureText(vt).width+56;x.fillStyle=`rgba(${acRGBs()},.13)`;rr(x,W-P-vw,y-52,vw,74,37);x.fill();x.fillStyle=AC;x.fillText(vt,W-P-vw+28,y+2);
  y+=100;x.fillStyle='#222';x.font=`400 34px ${FONT}`;y=wrap(x,textoRecibo(p),P,y,W-2*P,54);
  y+=30;x.textAlign='right';x.fillStyle='#444';x.font=`400 30px ${FONT}`;x.fillText((cfg.cidade?cfg.cidade+', ':'')+dataLonga(p.data)+'.',W-P,y);
  y+=150;x.textAlign='center';x.fillStyle=INK;x.font=`700 72px ${FD}`;x.fillText(cfg.responsavel||cfg.nome||'',W/2,y-14,W*.6);
  x.strokeStyle='#555';x.lineWidth=2;x.beginPath();x.moveTo(W*.2,y);x.lineTo(W*.8,y);x.stroke();
  y+=44;x.fillStyle='#222';x.font=`600 28px ${FONT}`;x.fillText(cfg.responsavel||cfg.nome||'',W/2,y);
  if(cfg.cnpj){y+=38;x.fillStyle=INK2;x.font=`400 25px ${FONT}`;x.fillText('CNPJ '+cfg.cnpj,W/2,y);}x.textAlign='left';y+=70;
  return toBlob(cropCanvas(cv,y),'image/jpeg',.92);}
async function compartRecibo(id){const p=DB.pagamentos.find(x=>x.id===id);try{const b=await gerarReciboImg(p);compartilharBlob(b,`recibo-${numRecibo(p)}.jpg`,`Recibo nº ${numRecibo(p)} · ${brl(p.valor)}`);}catch(e){console.error(e);toast('Erro ao gerar o recibo');}}

  <p class="credito">Polidoro · feito por Alan Correa</p>`);};

function salvarCfg(){['nome','responsavel','cnpj','tel','cidade','pix','pixNome'].forEach(k=>DB.cfg[k]=$('#g_'+k).value.trim());if(!DB.cfg.nome)DB.cfg.nome='Polidoro';save();aplicaTema();toast('Dados salvos');}
function salvarFat(){FAT_DEF.forEach(([k])=>{const v=num($('#f_'+k).value);if(v!=null&&v>=0)DB.cfg.fat[k]=v;});save();toast('Referências salvas');render();}

async function trocarLogo(inp){const f=inp.files[0];if(!f)return;try{const u=URL.createObjectURL(f);const img=await carregarImg(u);URL.revokeObjectURL(u);

  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);DB.cfg.logo=cv.toDataURL('image/png');save();aplicaTema();render();toast('Logo salva');}catch(e){toast('Não consegui ler a imagem');}}
async function exportar(comFotos){try{const d={app:'polidoro',versao:1,exportado:agoraISO(),db:DB};
  if(comFotos){toast('Preparando backup…');const fs=await idbGetAll();d.fotos=[];for(const f of fs){const {blob,...r}=f;d.fotos.push({...r,b64:await blobToDataURL(blob)});}}
  baixarBlob(new Blob([JSON.stringify(d)],{type:'application/json'}),`backup-polidoro-${isoDate(new Date())}${comFotos?'-com-fotos':''}.json`);}catch(e){toast('Erro no backup: '+e.message);}}
async function importar(inp){const f=inp.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.db)throw new Error('arquivo inválido');if(!confirm(Nuvem.user?'Substituir todos os dados deste aparelho E da sua conta na nuvem pelos do backup?':'Substituir todos os dados deste aparelho pelos do backup?'))return;
    DB=migrate(d.db);save();if(d.fotos){await idbClear();for(const x of d.fotos){const blob=await (await fetch(x.b64)).blob();const {b64,...r}=x;await idbPut({...r,blob});}}
    aplicaTema();toast('Backup importado');tab('inicio');}catch(e){toast('Não foi possível importar: '+e.message);}finally{inp.value='';}}
async function apagarTudo(){if(Nuvem.user){sairSheet();return;}if(!confirm('Apagar TODOS os dados e fotos deste aparelho?'))return;if(!confirm('Tem certeza? Isso não pode ser desfeito.'))return;
  localStorage.removeItem(KEY);try{await idbClear();}catch(e){}DB=load();aplicaTema();tab('inicio');toast('Dados apagados');}

/* ============ NUVEM (Firebase: login + sincronização) ============ */
const COLS=['clientes','visitas','estoque','movs','pagamentos'];
const META_KEY='polidoro_nuvem';
const Nuvem={on:false,user:null,auth:null,fs:null,subs:[],busy:false,timer:null,erro:'',ultima:null,esperando:null,renderPend:false};
const metaVazia=()=>({uid:null,snap:{},pend:{},fp:{},last:{}});
let META=(()=>{try{const m=JSON.parse(localStorage.getItem(META_KEY));if(m)return Object.assign(metaVazia(),m);}catch(e){}return metaVazia();})();
function salvaMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(META));}catch(e){}}
const hashStr=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return (h>>>0).toString(36)+'.'+s.length.toString(36);};
const semM=(k,v)=>(k==='_m'||k==='_s')?undefined:v;
const hashItem=o=>hashStr(JSON.stringify(o,semM));
function cfgItem(){const {modo,...c}=DB.cfg;return {cfg:c,seqRecibo:DB.seqRecibo,_m:DB.cfgM||0};}
const nuvemConfigurada=()=>!!(window.firebase&&FIREBASE_CONFIG.apiKey&&!/COLE_AQUI/.test(FIREBASE_CONFIG.apiKey));
const logado=()=>!!(Nuvem.on&&Nuvem.user&&META.uid===Nuvem.user.uid);
const pendentes=()=>Object.keys(META.pend).length+Object.keys(META.fp).length;
const refCol=col=>Nuvem.fs.collection('contas').doc(Nuvem.user.uid).collection(col);
const tsServ=()=>firebase.firestore.FieldValue.serverTimestamp();

function traduzErro(e){const c=(e&&e.code)||'';const m={
  'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'Senha incorreta.','auth/user-not-found':'Não existe conta com esse e-mail.',
  'auth/invalid-email':'E-mail inválido.','auth/email-already-in-use':'Já existe uma conta com esse e-mail. Use “Entrar”.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
  'auth/too-many-requests':'Muitas tentativas. Espere um pouco e tente de novo.','auth/network-request-failed':'Sem internet no momento.',
  'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication → Settings → Authorized domains).',
  'auth/operation-not-allowed':'Esse tipo de login não está ativado no Firebase (Authentication → Sign-in method).',
  'auth/popup-closed-by-user':'Login cancelado.','permission-denied':'O Firebase recusou o acesso. Confira as regras do Firestore.',
  'unavailable':'Sem conexão com a nuvem.','failed-precondition':'O banco Firestore ainda não foi criado no projeto.'};
  return m[c]||((e&&e.message)||'Erro desconhecido').replace(/^Firebase:\s*/,'');}

/* -- detecta o que mudou desde o último envio (compara um resumo de cada item) -- */
function detectarMudancas(){if(!META.uid)return 0;let n=0;const agora=Date.now();
  COLS.forEach(col=>{const snap=META.snap[col]||(META.snap[col]={});const vistos=new Set();
    DB[col].forEach(it=>{vistos.add(it.id);const h=hashItem(it);if(snap[it.id]!==h){it._m=Math.max(agora,(it._m||0)+1);snap[it.id]=h;META.pend[col+'/'+it.id]=it._m;n++;}});
    Object.keys(snap).forEach(id=>{if(!vistos.has(id)){delete snap[id];META.pend[col+'/'+id]=-agora;n++;}});});
  const sc=META.snap.cfg||(META.snap.cfg={});const h=hashItem(cfgItem());
  if(sc.main!==h){DB.cfgM=agora;sc.main=h;META.pend['cfg/main']=agora;n++;}
  return n;}
function agendarEnvio(ms=700){clearTimeout(Nuvem.timer);Nuvem.timer=setTimeout(enviar,ms);}
async function fotoParaNuvem(blob){if(blob.size<=650000)return blob;
  const u=URL.createObjectURL(blob);const img=await carregarImg(u);URL.revokeObjectURL(u);const s=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight));
  const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return toBlob(cv,'image/jpeg',.7);}
async function enviar(){if(!logado()||Nuvem.busy)return;const ent=Object.entries(META.pend);const fps=Object.entries(META.fp);
  if(!ent.length&&!fps.length){atualizaEstado();return;}
  Nuvem.busy=true;Nuvem.erro='';atualizaEstado();
  try{
    for(let i=0;i<ent.length;i+=300){const lote=ent.slice(i,i+300);const b=Nuvem.fs.batch();
      lote.forEach(([k,m])=>{const [col,id]=k.split('/');const ref=refCol(col).doc(id);
        if(m<0)return b.set(ref,{id,_del:true,_m:-m,_s:tsServ()});
        const it=col==='cfg'?cfgItem():DB[col].find(x=>x.id===id);
        if(!it)return b.set(ref,{id,_del:true,_m:m,_s:tsServ()});
        b.set(ref,Object.assign(JSON.parse(JSON.stringify(it,semM)),{id,_m:it._m||m,_s:tsServ()}));});
      await b.commit();
      lote.forEach(([k,m])=>{if(META.pend[k]===m)delete META.pend[k];});salvaMeta();atualizaEstado();}
    for(const [id,op] of fps){
      if(op==='del')await refCol('fotos').doc(id).set({id,_del:true,_m:Date.now(),_s:tsServ()});
      else{const f=await idbGet(id);
        if(f){const b64=await blobToDataURL(await fotoParaNuvem(f.blob));await refCol('fotos').doc(id).set({id,clienteId:f.clienteId,visitaId:f.visitaId||null,tipo:f.tipo,data:f.data,b64,_m:Date.now(),_s:tsServ()});}}
      if(META.fp[id]===op)delete META.fp[id];salvaMeta();atualizaEstado();}
    Nuvem.ultima=new Date();
  }catch(e){console.error(e);Nuvem.erro=traduzErro(e);}
  finally{Nuvem.busy=false;atualizaEstado();if(!Nuvem.erro&&pendentes())agendarEnvio(1500);}}

/* -- recebe o que mudou na nuvem (só o que é mais novo que a última leitura) -- */
function ouvir(){pararOuvir();if(!logado())return;
  [...COLS,'cfg','fotos'].forEach(col=>{const desde=firebase.firestore.Timestamp.fromMillis(META.last[col]||0);
    const un=refCol(col).where('_s','>',desde).onSnapshot(snap=>{let mudou=false;const fotos=[];
      snap.docChanges().forEach(ch=>{if(ch.type==='removed'||ch.doc.metadata.hasPendingWrites)return;const d=ch.doc.data();
        const s=d._s&&d._s.toMillis?d._s.toMillis():0;if(s>(META.last[col]||0))META.last[col]=s;
        if(col==='fotos')fotos.push(d);else if(aplicarRemoto(col,ch.doc.id,d))mudou=true;});
      salvaMeta();if(mudou){saveLocal();if(col==='cfg')aplicaTema();agendarRender();}
      if(fotos.length)aplicarFotos(fotos);
      Nuvem.ultima=new Date();if(Nuvem.erro==='Sem conexão com a nuvem.')Nuvem.erro='';atualizaEstado();
    },err=>{console.error(err);Nuvem.erro=traduzErro(err);atualizaEstado();});
    Nuvem.subs.push(un);});}
function pararOuvir(){Nuvem.subs.forEach(u=>{try{u();}catch(e){}});Nuvem.subs=[];}
function aplicarRemoto(col,id,d){const key=col+'/'+id;const pm=META.pend[key];
  if(pm!=null&&Math.abs(pm)>=(d._m||0))return false;
  if(col==='cfg'){if(!d.cfg)return false;const modo=DB.cfg.modo;DB.cfg=Object.assign({},DEF_CFG,d.cfg,{modo});DB.cfg.fat=Object.assign({},DEF_CFG.fat,d.cfg.fat||{});
    DB.seqRecibo=Math.max(DB.seqRecibo||1,d.seqRecibo||1);DB.cfgM=d._m||0;(META.snap.cfg=META.snap.cfg||{}).main=hashItem(cfgItem());delete META.pend[key];return true;}
  const arr=DB[col];const i=arr.findIndex(x=>x.id===id);const loc=i>=0?arr[i]:null;const snap=META.snap[col]||(META.snap[col]={});
  if(loc&&pm==null&&(loc._m||0)>(d._m||0))return false;
  delete META.pend[key];
  if(d._del){delete snap[id];if(i>=0){arr.splice(i,1);return true;}return false;}
  const {_s,...it}=d;it.id=id;const h=hashItem(it);snap[id]=h;
  if(loc&&hashItem(loc)===h){loc._m=it._m;return false;}
  if(i>=0)arr[i]=it;else arr.push(it);
  if(col==='movs')arr.sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  return true;}
async function aplicarFotos(l){let n=0;
  for(const d of l){try{if(META.fp[d.id])continue;
    if(d._del){await idbDel(d.id,true);n++;continue;}
    if(await idbGet(d.id))continue;
    const blob=await (await fetch(d.b64)).blob();await idbPut({id:d.id,clienteId:d.clienteId,visitaId:d.visitaId,tipo:d.tipo,data:d.data,blob},true);n++;}catch(e){console.error(e);}}
  if(n)agendarRender();}
function marcaFoto(id,op){if(!META.uid)return;META.fp[id]=op;salvaMeta();if(logado())agendarEnvio();}
let _rt;function agendarRender(){clearTimeout(_rt);_rt=setTimeout(()=>{const v=STACK[STACK.length-1].name;const ae=document.activeElement;
  if(sheetAberta()||['clienteForm','visitaForm','config'].includes(v)||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))){Nuvem.renderPend=true;return;}render();},400);}

/* -- entrada e saída da conta -- */
function perguntarJuncao(){return new Promise(res=>{Nuvem.esperando=res;
  openSheet('Juntar os dados?',`<p style="margin-bottom:12px">Esta conta já tem dados salvos na nuvem, e este aparelho também tem dados.</p>
  <button class="btn bloco" onclick="Nuvem.resp('juntar')">${ic('nuvem')}Juntar os dois</button><p class="dica" style="margin:4px 4px 12px">Os clientes, visitas e pagamentos deste aparelho vão para a conta, junto com os que já estão lá.</p>
  <button class="btn ghost bloco" onclick="Nuvem.resp('nuvem')">Usar só os da nuvem</button><p class="dica" style="margin:4px 4px 0">Apaga o que está neste aparelho e baixa os dados da conta.</p>`);});}
Nuvem.resp=r=>{const f=Nuvem.esperando;Nuvem.esperando=null;closeSheet();if(f)f(r);};
async function iniciarSync(user){Nuvem.user=user;Nuvem.on=true;Nuvem.erro='';atualizaEstado();
  if(META.uid!==user.uid){const base=Nuvem.fs.collection('contas').doc(user.uid);let temRemoto=false,estRem=[];
    try{temRemoto=!(await base.collection('clientes').limit(1).get()).empty||!(await base.collection('cfg').limit(1).get()).empty;
      if(temRemoto)estRem=(await base.collection('estoque').get()).docs.map(x=>x.data()).filter(x=>!x._del);}
    catch(e){console.error(e);Nuvem.erro=traduzErro(e);atualizaEstado();return;}
    const temLocal=DB.clientes.length>0||DB.visitas.length>0||DB.pagamentos.length>0;
    let modo='juntar';if(temRemoto&&temLocal)modo=await perguntarJuncao();else if(temRemoto)modo='nuvem';
    META=metaVazia();META.uid=user.uid;
    if(modo==='nuvem'){const m=DB.cfg.modo;DB=migrate({cfg:{modo:m}});DB.estoque=[];saveLocal();try{await idbClear();}catch(e){}META.snap.cfg={main:hashItem(cfgItem())};}
    else{if(temRemoto){META.snap.cfg={main:hashItem(cfgItem())};
        const porNome=new Map(estRem.map(x=>[String(x.nome||'').toLowerCase().trim(),x]));const troca={};
        DB.estoque=DB.estoque.filter(it=>{const r=porNome.get(String(it.nome||'').toLowerCase().trim());if(r){troca[it.id]=r.id;return false;}return true;});
        DB.visitas.forEach(v=>(v.produtos||[]).forEach(p=>{if(troca[p.itemId])p.itemId=troca[p.itemId];}));DB.movs.forEach(m=>{if(troca[m.itemId])m.itemId=troca[m.itemId];});}
      try{(await idbGetAll()).forEach(f=>{META.fp[f.id]='up';});}catch(e){}}
    detectarMudancas();saveLocal();salvaMeta();aplicaTema();render();
    toast(modo==='nuvem'?'Baixando os dados da sua conta…':'Conta conectada. Enviando os dados para a nuvem…',3500);}
  ouvir();agendarEnvio(300);atualizaEstado();agendarRender();}
function pararSync(){pararOuvir();clearTimeout(Nuvem.timer);Nuvem.on=false;Nuvem.user=null;Nuvem.busy=false;}
function iniciarFirebase(){if(!nuvemConfigurada())return;
  try{firebase.initializeApp(FIREBASE_CONFIG);Nuvem.auth=firebase.auth();Nuvem.fs=firebase.firestore();
    Nuvem.auth.getRedirectResult().catch(e=>{Nuvem.erro=traduzErro(e);atualizaEstado();});
    Nuvem.auth.onAuthStateChanged(u=>{if(u)iniciarSync(u);else{pararSync();atualizaEstado();agendarRender();}});
  }catch(e){console.error(e);Nuvem.erro=traduzErro(e);}}
async function entrarGoogle(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await Nuvem.auth.signInWithPopup(p);}
  catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request','auth/web-storage-unsupported'].includes(e.code)){try{await Nuvem.auth.signInWithRedirect(p);}catch(e2){toast(traduzErro(e2),4500);}}
    else if(e.code!=='auth/popup-closed-by-user')toast(traduzErro(e),4500);}}
async function entrarEmail(criar){const em=$('#lgEmail').value.trim(),se=$('#lgSenha').value;if(!em||!se)return toast('Preencha o e-mail e a senha');
  try{if(criar)await Nuvem.auth.createUserWithEmailAndPassword(em,se);else await Nuvem.auth.signInWithEmailAndPassword(em,se);}catch(e){toast(traduzErro(e),4500);}}
async function esqueciSenha(){const em=$('#lgEmail').value.trim();if(!em)return toast('Digite o seu e-mail primeiro');
  try{await Nuvem.auth.sendPasswordResetEmail(em);toast('Enviamos um link para '+em,4500);}catch(e){toast(traduzErro(e),4500);}}
function sairSheet(){const p=pendentes();
  openSheet('Sair da conta',`${p?`<div class="aviso alerta">${ic('alerta')}<p>${p} alteração(ões) ainda não chegaram à nuvem. Conecte-se à internet antes de limpar este aparelho.</p></div>`:''}
  <button class="btn ghost bloco" onclick="sairConta(false)">Sair e manter os dados aqui</button><p class="dica" style="margin:4px 4px 12px">Bom para o seu próprio celular. Ao entrar de novo, continua de onde parou.</p>
  <button class="btn perigo bloco" onclick="sairConta(true)">${ic('lixo')}Sair e limpar este aparelho</button><p class="dica" style="margin:4px 4px 0">Para celular emprestado. Os dados continuam salvos na nuvem.</p>`);}
async function sairConta(limpar){if(limpar&&pendentes()&&!confirm('Ainda há alterações não enviadas. Limpar mesmo assim?'))return;closeSheet();
  pararSync();try{await Nuvem.auth.signOut();}catch(e){}
  if(limpar){const m=DB.cfg.modo;META=metaVazia();salvaMeta();localStorage.removeItem(KEY);try{await idbClear();}catch(e){}DB=migrate({cfg:{modo:m}});saveLocal();aplicaTema();}
  toast(limpar?'Você saiu e este aparelho foi limpo':'Você saiu da conta');tab('inicio');}
function sincronizarAgora(){if(!logado())return;Nuvem.erro='';detectarMudancas();saveLocal();salvaMeta();ouvir();enviar();toast('Sincronizando…');}

/* -- status em texto (atualiza sem redesenhar a tela) -- */
function nuvemStatus(){if(!nuvemConfigurada())return {c:'',t:'Nuvem não configurada'};
  if(!Nuvem.user)return {c:'alerta',t:'Só neste aparelho · entre na conta para ter backup'};
  const p=pendentes();
  if(Nuvem.erro&&Nuvem.erro!=='Sem conexão com a nuvem.')return {c:'perigo',t:Nuvem.erro};
  if(!navigator.onLine||Nuvem.erro)return {c:'alerta',t:`Sem internet${p?` · ${p} alteração(ões) aguardando`:' · tudo salvo neste aparelho'}`};
  if(Nuvem.busy||p)return {c:'',t:`Sincronizando${p?` · ${p} pendente(s)`:''}…`};
  return {c:'ok',t:'Salvo na nuvem'+(Nuvem.ultima?` · ${pad(Nuvem.ultima.getHours())}:${pad(Nuvem.ultima.getMinutes())}`:'')};}
const nuvemHTML=()=>{const s=nuvemStatus();return `<span class="nuvem-st ${s.c}">${ic(s.c==='perigo'||s.c==='alerta'?'nuvemx':'nuvem')}<span>${esc(s.t)}</span></span>`;};
function atualizaEstado(){$$('[data-nuvem]').forEach(el=>{el.innerHTML=nuvemHTML();});}
window.addEventListener('online',()=>{if(Nuvem.erro==='Sem conexão com a nuvem.')Nuvem.erro='';atualizaEstado();if(logado())agendarEnvio(200);});
window.addEventListener('offline',atualizaEstado);

function contaHTML(){
  if(!nuvemConfigurada())return `<div class="cartao lista"><p class="meta">A nuvem ainda não foi configurada neste app. Os dados ficam salvos só neste aparelho — use o backup abaixo.</p></div>`;
  if(!Nuvem.user)return `<div class="cartao lista"><p style="font-size:.9rem;margin-bottom:12px">Entre com uma conta para ter <b>backup automático</b> na nuvem e usar o Polidoro em <b>mais de um aparelho</b>, com tudo sincronizado.</p>
    <button class="btn ghost bloco btn-google" onclick="entrarGoogle()">${G_ICO}Entrar com o Google</button>
    <div class="divisor"><span>ou com e-mail</span></div>
    <label class="bloco"><span class="rotulo">E-mail</span><input id="lgEmail" type="email" autocomplete="email" inputmode="email"></label>

/* -- atualização do app (service worker) -- */
function registrarSW(){if(!('serviceWorker' in navigator)||!/^https?:/.test(location.protocol))return;
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
    const avisar=w=>{const el=document.createElement('div');el.className='atualiza';el.innerHTML=`<span>Nova versão do Polidoro pronta.</span><button class="btn mini">Atualizar</button>`;
      el.querySelector('button').onclick=()=>{w.postMessage('SKIP_WAITING');};document.body.appendChild(el);};
    if(reg.waiting&&navigator.serviceWorker.controller)avisar(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)avisar(w);});});
  }).catch(e=>console.warn('SW',e));
  let recarregou=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(recarregou)return;recarregou=true;location.reload();});});}
